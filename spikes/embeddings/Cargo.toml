[package]
name = "embeddings-spike"
version = "0.0.0"
edition = "2024"
publish = false

# Standalone on purpose: keeps fastembed and ONNX Runtime out of the cli workspace build.
[workspace]

[dependencies]
fastembed = { version = "=7.8.0", default-features = false, features = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls", "onig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
debug = false
