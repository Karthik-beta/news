# Cloudflare deploys: the three Workers (api, mcp, search) and, from Phase 6, the site's SSR Worker.
# Runs from the Actions tab or Board (workflow_dispatch) on main, and from cd.yml after CI passed on a push to main
# (workflow_call). cd.yml is a separate workflow, so main's CI run never waits for the `production` reviewer. Nothing deploys from a PR or from another branch: the plan stage refuses (a dry run
# excepted, which deploys nothing) and the `production` environment only admits `main`.
# After a deploy of the site (target all or site) a smoke test checks the live site (infra/cloud/smoke.ts); a deploy
# of a single Worker has none.
#
# Needs, all set by Karthik and never by an agent or this file:
#   - environment `production` (Settings > Environments) with a required reviewer, and deployment branches limited
#     to `main` only
#   - secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as environment secrets of `production` only. Never as
#     repository secrets: those reach every job in every workflow, including ones that run third-party code.
#
# Two stages, so the Cloudflare secrets never sit in a job that runs dependency install scripts:
#   plan      no environment, no secrets. Works out what to deploy, installs (with install scripts) and bundles each
#             selected Worker with `wrangler deploy --dry-run`, and builds the site when it deploys.
#   deploy    `environment: production`, one job per target that is selected and ready. Installs with
#             --ignore-scripts and runs only Wrangler from the lockfile; no third-party actions.
# A target that cannot deploy (not on main, a TODO in its config, no wrangler config, no secrets) is skipped with a
# notice when the target is `all`, and fails the run when it was picked by name, unless it is a dry run.
#
# A Worker deploys only when its wrangler.jsonc is ready. The Workers' configs still carry a `TODO(` comment where
# the real D1 / R2 bindings go (Phase 0 accounts step); deploying them as they are would publish a Worker whose
# bindings are missing. Declare the bindings and delete the TODO comment, and the Worker is picked up here.
# The site is static today (no adapter, no wrangler config); it deploys once `site/wrangler.jsonc` exists (Phase 6).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        options: [all, api, mcp, search, site]
        default: all
      dry_run:
        description: Bundle and validate only; deploy nothing (needs no secrets)
        type: boolean
        default: false
  # Continuous deployment: cd.yml calls this workflow when CI has completed successfully for a push to main, so a
  # deploy never starts before CI has passed. Same stages, same guards, same environment approval. `sha` is the
  # commit CI tested; the plan stage deploys only if it is still the head of main.
  workflow_call:
    inputs:
      target:
        type: string
        default: all
      sha:
        type: string
        default: ""
      dry_run:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never stop a deploy half way

jobs:
  plan:
    name: Plan and dry-run bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No `environment:` and no `secrets.` anywhere in this job: it runs install scripts and builds.
    outputs:
      workers: ${{ steps.plan.outputs.workers }}
      site: ${{ steps.plan.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - id: plan
        env:
          TARGET: ${{ inputs.target || 'all' }}
          DRY_RUN: ${{ inputs.dry_run }}
          SHA: ${{ inputs.sha || github.sha }}
          # Read-only (contents: read); used by the head-of-main check below only. This step installs nothing.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=0
          # The first wrangler config of a directory (jsonc, json or toml), or nothing.
          config_of() {
            for f in "$1/wrangler.jsonc" "$1/wrangler.json" "$1/wrangler.toml"; do
              if [ -f "$f" ]; then echo "$f"; return; fi
            done
          }
          # A deploy publishes the commit CI tested, and only while it is still the head of main: a newer push has its
          # own CI run and its own deploy, and an older commit must never overwrite a newer one.
          if [ "$DRY_RUN" != "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            head=$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)
            if [ "$head" != "$SHA" ]; then
              echo "::notice title=Nothing deployed::$SHA is no longer the head of main (${head:-unknown}); the newer commit deploys after its own CI run."
              { echo "workers=[]"; echo "bundle="; echo "site=false"; } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # A target that cannot deploy: an error when it was picked by name (and this is not a dry run), else a notice.
          cannot() {
            if [ "$TARGET" != "all" ] && [ "$DRY_RUN" != "true" ]; then
              echo "::error title=$1 cannot deploy::$2"
              failed=1
            else
              echo "::notice title=$1 not deployed::$2"
            fi
          }
          workers=()
          bundle=()
          site=false
          for worker in api mcp search; do
            if [ "$TARGET" != "all" ] && [ "$TARGET" != "$worker" ]; then continue; fi
            bundle+=("$worker")
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice title=Worker $worker not deployed::Dry run: the bundle is checked below, nothing is deployed."
            elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
              cannot "Worker $worker" "Deploys run from main only (this run is on $GITHUB_REF)."
            elif [ -z "$(config_of "workers/$worker")" ]; then
              cannot "Worker $worker" "workers/$worker has no wrangler config."
            elif grep -q 'TODO(' "$(config_of "workers/$worker")"; then
              cannot "Worker $worker" "$(config_of "workers/$worker") is not deploy-ready: it still has a TODO for its real bindings."
            else
              workers+=("$worker")
            fi
          done
          if [ "$TARGET" = "all" ] || [ "$TARGET" = "site" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              echo "::notice title=Site not deployed::Dry run: nothing is deployed."
            elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
              cannot "Site" "Deploys run from main only (this run is on $GITHUB_REF)."
            elif [ -z "$(config_of site)" ]; then
              cannot "Site" "The site has no wrangler config yet: it is static until the SSR Worker arrives in Phase 6 (Technical Design, Cloud services)."
            elif grep -q 'TODO(' "$(config_of site)"; then
              cannot "Site" "$(config_of site) is not deploy-ready: it still has a TODO for its real bindings."
            else
              site=true
            fi
          fi
          {
            echo "workers=$(jq -cn '$ARGS.positional' --args "${workers[@]}")"
            echo "bundle=${bundle[*]}"
            echo "site=$site"
          } >> "$GITHUB_OUTPUT"
          exit "$failed"
      - uses: ./.github/actions/setup
        if: steps.plan.outputs.bundle != '' || steps.plan.outputs.site == 'true'
      # Proves each selected Worker bundles with its real config. Needs no Cloudflare account.
      - name: Dry-run bundle
        if: steps.plan.outputs.bundle != ''
        env:
          BUNDLE: ${{ steps.plan.outputs.bundle }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          for worker in $BUNDLE; do
            echo "::group::$worker"
            (cd "workers/$worker" && bunx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/bundle-$worker")
            echo "::endgroup::"
          done
      - name: Build the site
        if: steps.plan.outputs.site == 'true'
        run: bun run build
        working-directory: site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.plan.outputs.site == 'true'
        with:
          name: site-dist
          path: site/dist/
          retention-days: 1

  workers:
    name: Deploy Worker (${{ matrix.worker }})
    needs: plan
    if: needs.plan.outputs.workers != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.plan.outputs.workers) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - id: secrets
        name: Cloudflare secrets are set
        env:
          WORKER: ${{ matrix.worker }}
          BY_NAME: ${{ inputs.target != '' && inputs.target != 'all' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as secrets of the production environment."
          if [ "$BY_NAME" = "true" ]; then
            echo "::error title=Worker $WORKER cannot deploy::$message"
            exit 1
          fi
          echo "::notice title=Worker $WORKER not deployed::$message"
          echo "ready=false" >> "$GITHUB_OUTPUT"
      # Wrangler needs Node >= 22.12. No cache in this job: nothing restored from a cache runs next to the secrets.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          bun-version: 1.4.3
      # No install scripts: Wrangler's esbuild finds its platform binary without one, and the deploy needs no workerd.
      - if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        working-directory: workers/${{ matrix.worker }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler deploy

  site:
    name: Deploy site
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    outputs:
      deployed: ${{ steps.secrets.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha || github.sha }}
          persist-credentials: false
      - id: secrets
        name: Cloudflare secrets are set
        env:
          BY_NAME: ${{ inputs.target == 'site' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          message="CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not set as secrets of the production environment."
          if [ "$BY_NAME" = "true" ]; then
            echo "::error title=Site cannot deploy::$message"
            exit 1
          fi
          echo "::notice title=Site not deployed::$message"
          echo "ready=false" >> "$GITHUB_OUTPUT"
      # The site built by the plan job, which ran the install scripts; this job only uploads it.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: site-dist
          path: site/dist/
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          bun-version: 1.4.3
      - if: steps.secrets.outputs.ready == 'true'
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Deploy to Cloudflare
        if: steps.secrets.outputs.ready == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: bunx wrangler deploy

  smoke:
    name: Production smoke test
    needs: [workers, site]
    # Only after the site was actually deployed (target all or site, and its secrets were set: the site job succeeds
    # without deploying when they are not): the checks need the whole site, so a deploy of a single Worker has no
    # smoke test. Runs even when a Worker job failed, to show what is live. No secrets, no environment, nothing
    # installed: the script only makes GET requests (and one MCP POST) to the public site.
    if: ${{ !cancelled() && needs.site.result == 'success' && needs.site.outputs.deployed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # An article from R2 (the first in the feed), home, a hub, search, MCP tools/list, robots.txt, a sitemap, a feed.
      - run: bun infra/cloud/smoke.ts
