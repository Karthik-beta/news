# Static checks on the repo's own plumbing: workflows, config files, skills and agents, dependency advisories.
# A separate file from ci.yml so the required checks there stay exactly as they are. No path filters: they are
# cheap, and a path-filtered workflow that is skipped leaves a required check pending forever.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Weekly: new advisories appear without any change to the repo.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Lints every file in .github/workflows and the local composite actions' expressions, and runs
      # shellcheck over the `run:` scripts (the image bundles it).
      - uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

  config:
    name: Config and skills (parse, frontmatter)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # These two scripts use only Bun's own parsers, so no dependency install is needed.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # JSON, YAML and TOML syntax: tsconfig, wrangler configs, issue forms, tokens.json, Cargo, Compose, ...
      - run: bun scripts/validate-config.ts
      # Every SKILL.md and .claude/agents/*.md has `name` and `description`; a skill's name matches its folder.
      - run: bun scripts/validate-skills.ts

  # The two advisory jobs below are signals, not merge gates: the advisory feeds change without any commit, so a
  # required check here could block an unrelated PR. Do not mark them required.
  audit:
    name: Dependency audit (bun audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Only high and critical advisories are reported, and they fail the job.
      - run: bun audit --audit-level=high

  rust-advisories:
    name: Rust advisories (cargo deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # RustSec advisories for cli/Cargo.lock, with the ignore list in cli/deny.toml. Bans, licences and sources are
      # the required "Dependencies (cargo deny)" check in ci.yml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: cli/Cargo.toml
          command: check
          command-arguments: advisories
