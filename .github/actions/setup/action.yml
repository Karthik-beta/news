name: Set up Bun and install dependencies
description: Node 22 (Vitest and Wrangler run under Node), Bun at the project's pinned version, a cached package store, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    # Vitest and Wrangler need Node >= 22.12; the runner image's default Node is older.
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: "22"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    - run: bun install --frozen-lockfile
      shell: bash
