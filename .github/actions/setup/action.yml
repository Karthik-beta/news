name: Set up Bun and install dependencies
description: Node 22 (Vitest and Wrangler run under Node), Bun at the project's pinned version, a cached package store, and a frozen-lockfile install.

runs:
  using: composite
  steps:
    # Vitest and Wrangler need Node >= 22.12; the runner image's default Node is older.
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.4.3
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-
    # OpenUI (ADR 0001): @openuidev/lang-core has an install-telemetry postinstall. Bun never runs it, because the
    # package is not in trustedDependencies (keep it that way); this also turns off its runtime telemetry for every
    # later step of the job (build, tests, rendering).
    - name: Turn off OpenUI telemetry
      run: echo "OPENUI_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"
      shell: bash
    - run: bun install --frozen-lockfile
      shell: bash
