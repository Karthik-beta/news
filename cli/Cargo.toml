[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Our crates (see cli/README.md, "Crate map").
news-core = { path = "crates/news-core" }
news-store = { path = "crates/news-store" }
news-telemetry = { path = "crates/news-telemetry" }
news-dispatch = { path = "crates/news-dispatch" }
news-chief = { path = "crates/news-chief" }
news-contacts = { path = "crates/news-contacts" }
news-wire = { path = "crates/news-wire" }
news-diary = { path = "crates/news-diary" }
news-clerk = { path = "crates/news-clerk" }
news-roster = { path = "crates/news-roster" }
news-taster = { path = "crates/news-taster" }
news-nose = { path = "crates/news-nose" }
news-home = { path = "crates/news-home" }
news-fixer = { path = "crates/news-fixer" }
news-ghost = { path = "crates/news-ghost" }
news-proof = { path = "crates/news-proof" }
news-rewrite = { path = "crates/news-rewrite" }
news-press = { path = "crates/news-press" }
news-critic = { path = "crates/news-critic" }
news-standing = { path = "crates/news-standing" }
news-rota = { path = "crates/news-rota" }
news-hotline = { path = "crates/news-hotline" }
news-service = { path = "crates/news-service" }
news-win = { path = "crates/news-win" }
news-ledger = { path = "crates/news-ledger" }
news-connectors = { path = "crates/news-connectors" }
news-board = { path = "crates/news-board" }

# Third party. TLS only in the Runner (news-wire, rustls): PostgreSQL, ClickHouse and the OTel collector are
# all on loopback.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = { version = "0.10", default-features = false, features = ["std"] }
jsonschema = { version = "0.61", default-features = false }
tokio-util = { version = "0.7", default-features = false }
clap = { version = "4", features = ["derive"] }
croner = "4"
fastrand = "2"
httpdate = "1"
proptest = "1"
roxmltree = "0.21"
sha2 = "0.11"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
zstd = { version = "0.14", default-features = false }
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "migrate", "json", "uuid", "chrono", "derive", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync", "io-util", "net"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.34", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
uuid = { version = "1", features = ["v4", "serde"] }
# Board (egui). `egui` alone is pure Rust and builds everywhere; `eframe` (the window) and the toast
# crate are Windows-only target dependencies of news-board, so Linux CI never builds them.
egui = { version = "=0.37.0", default-features = false, features = ["default_fonts"] }
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
tauri-winrt-notification = "=0.8.1"
windows-service = "=0.8.1"
unicode-normalization = "0.1"
# Taster's embedder (ADR 0011), behind news-taster's `embed` feature. ort downloads its ONNX Runtime binary at
# build time, so nothing here is built unless that feature is on.
fastembed = { version = "=7.8.0", default-features = false, features = ["onnx", "ort-download-binaries-native-tls", "hf-hub-native-tls", "onig"] }
# Wipes the service password (news-win) when it is dropped.
zeroize = "1.9"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Console",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_Security_Credentials",
    "Win32_Security_Authentication_Identity",
    "Wdk_System_Threading",
] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
