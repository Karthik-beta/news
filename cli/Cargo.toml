[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# Our crates (see cli/README.md, "Crate map").
news-core = { path = "crates/news-core" }
news-store = { path = "crates/news-store" }
news-telemetry = { path = "crates/news-telemetry" }
news-dispatch = { path = "crates/news-dispatch" }
news-chief = { path = "crates/news-chief" }
news-contacts = { path = "crates/news-contacts" }
news-wire = { path = "crates/news-wire" }
news-diary = { path = "crates/news-diary" }
news-clerk = { path = "crates/news-clerk" }
news-roster = { path = "crates/news-roster" }
news-taster = { path = "crates/news-taster" }
news-nose = { path = "crates/news-nose" }
news-fixer = { path = "crates/news-fixer" }
news-ghost = { path = "crates/news-ghost" }
news-proof = { path = "crates/news-proof" }
news-rewrite = { path = "crates/news-rewrite" }
news-press = { path = "crates/news-press" }
news-critic = { path = "crates/news-critic" }
news-board = { path = "crates/news-board" }

# Third party. No TLS anywhere: PostgreSQL, ClickHouse and the OTel collector are all on loopback.
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
clap = { version = "4", features = ["derive"] }
croner = "3"
fastrand = "2"
opentelemetry = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-none", "postgres", "migrate", "json", "uuid", "chrono", "derive", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
tracing = "0.1"
tracing-opentelemetry = { version = "0.32", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 4
