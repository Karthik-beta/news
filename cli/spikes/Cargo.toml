# Spike workspace for the Bureau service and Board (docs/spikes/bureau-service.md, ADR 0007).
# Its own workspace on purpose: nothing here is wired into `news.exe`, and the main workspace's
# `unsafe_code = "forbid"` lint does not apply (these spikes call Win32 directly).
[workspace]
resolver = "3"
members = ["bureau-spike", "board-spike"]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "UNLICENSED"
publish = false

# Same release profile as cli/Cargo.toml, so sizes compare.
[profile.release]
lto = "thin"
codegen-units = 4
