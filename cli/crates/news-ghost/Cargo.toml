[package]
name = "news-ghost"
description = "Ghost, the AI job runner hosted by the Bureau service (Bureau Design §3.9, §7): one lean `claude -p` per `ai` job in the AI Job Object, with an allow-listed environment, one A2 repair, usage-limit pauses, the per-run token ceiling and `ai_calls` rows."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Test-only stand-in for `claude` (records its argv, environment and stdin; replies as told by its
# input). The tests run it through Ghost; never shipped, never the real CLI.
[[bin]]
name = "fake-claude"
path = "src/bin/fake_claude.rs"
test = false
doc = false

[dependencies]
news-core = { workspace = true }
news-dispatch = { workspace = true }
news-rota = { workspace = true }
news-standing = { workspace = true }
news-store = { workspace = true }
news-telemetry = { workspace = true }
news-win = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true, features = ["process"] }
tracing = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
