[package]
name = "news-board"
description = "Board, the desktop app (ADR 0007 decision 3): egui screens over the Hotline, the generated token theme, toasts, Credential Manager secrets. `news board` runs it."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[build-dependencies]
serde_json = { workspace = true }

[dependencies]
news-core = { workspace = true }
news-hotline = { workspace = true }
news-win = { workspace = true }
egui = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }

[target.'cfg(windows)'.dependencies]
eframe = { workspace = true }
tauri-winrt-notification = { workspace = true }

[dev-dependencies]
news-hotline = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
