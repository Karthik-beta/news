[package]
name = "news"
description = "The News agent toolbox CLI (see the Technical Design, \"Agent toolbox\")."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "news"
path = "src/main.rs"

[dependencies]
news-core = { path = "../news-core" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.49.0"
postgres = "0.19.14"
predicates = "3.1.4"
