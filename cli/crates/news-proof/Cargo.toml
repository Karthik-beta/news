[package]
name = "news-proof"
description = "Proof (Bureau Design §3.10): the code checks C1-C14 on a rendered page bundle, and the Markup they produce. Render is built in a separate issue branch; its job handlers stay stubs."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
news-core = { workspace = true }
news-ledger = { workspace = true }
chrono = { workspace = true }
# Blocking client for the link checks (C10); TLS is installed by the `news` binary (news-wire's Runner).
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
# Already in the tree (news-telemetry, news-wire): a test that builds a reqwest client needs the provider the
# `news` binary installs in `main`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
uuid = { workspace = true }

[lints]
workspace = true
