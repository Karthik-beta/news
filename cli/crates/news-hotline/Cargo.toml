[package]
name = "news-hotline"
description = "The Hotline protocol (ADR 0007, ADR 0008 §8): frames, messages, the command table, peer admission, the event bus, a transport-generic server loop and the client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[features]
# `ServerConfig::for_tests` (test pipe names); never in a release build.
test-support = []

[dependencies]
news-core = { workspace = true }
chrono = { workspace = true }
jsonschema = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
# Paused time for the backoff and slow-subscriber tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
