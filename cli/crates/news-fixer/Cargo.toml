[package]
name = "news-fixer"
description = "Fixer (Bureau Design §3.8): the brief for one story, its size budget and A5 requests, and the cached prompt prefix per page type."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
news-core = { workspace = true }
news-dispatch = { workspace = true }
news-ledger = { workspace = true }
news-store = { workspace = true }
news-taster = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
news-connectors = { workspace = true }
news-contacts = { workspace = true }
news-proof = { workspace = true }
# Already in the tree (news-wire): Plate's client needs the provider the `news` binary installs in `main`.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
jsonschema = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
