[package]
name = "news-taster"
description = "Taster (Bureau Design §3.6): duplicates, event keys, stories, update detection and the scoring inputs Nose reads."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
news-core = { workspace = true }
news-store = { workspace = true }
news-clerk = { workspace = true }
news-dispatch = { workspace = true }
news-nose = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
toml = { workspace = true }
fastembed = { workspace = true, optional = true }

[features]
# The bge-small embedder (`embed::FastEmbedder`). Off by default: it pulls in fastembed and ONNX Runtime.
embed = ["dep:fastembed"]

[lints]
workspace = true
