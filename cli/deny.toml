# cargo-deny policy for the `news` CLI workspace. Run from `cli/`: `cargo deny check`.
# Install once: `cargo install cargo-deny --locked`.

[graph]
# Only check what actually ships or is built on the platforms we use (laptop and CI).
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisories. Vulnerabilities, unmaintained and unsound crates all fail the check;
# an ignore needs an id and a reason, and an expiry in the reason text.
version = 2
yanked = "deny"
# The version-2 defaults only fail unmaintained/unsound crates that are direct workspace
# dependencies; "all" applies the policy above to transitive dependencies too.
unmaintained = "all"
unsound = "all"
ignore = [
    # chrono: unmaintained notice only, no vulnerability. sqlx 0.9, croner and our crates need it;
    # no maintained drop-in yet. Revisit by 2027-02-28.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no drop-in for sqlx/croner; revisit by 2027-02-28" },
    # chrono-tz: unmaintained notice only, no vulnerability; Rota needs IANA zones. Revisit with chrono (jiff) by 2027-02-28.
    { id = "RUSTSEC-2026-0555", reason = "chrono-tz unmaintained; Rota time zones; revisit with chrono by 2027-02-28" },
    # zbus_names, zvariant, zvariant_derive: unmaintained notices only. They come in through AccessKit's
    # Linux AT-SPI backend (eframe, Board's window); Board runs on Windows only, where none is built.
    # Revisit with eframe by 2027-02-28.
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; Linux-only via AccessKit under eframe (Board is Windows-only); revisit by 2027-02-28" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; Linux-only via AccessKit under eframe (Board is Windows-only); revisit by 2027-02-28" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; Linux-only via AccessKit under eframe (Board is Windows-only); revisit by 2027-02-28" },
    # paste: unmaintained notice only (a proc-macro, nothing at run time). Comes in through tokenizers under
    # fastembed, Taster's embedder (news-taster feature `embed`, ADR 0011). Revisit with fastembed by 2027-02-28.
    { id = "RUSTSEC-2024-0436", reason = "paste unmaintained; proc-macro under tokenizers/fastembed (news-taster embed); revisit by 2027-02-28" },
]

[licenses]
# The project itself is private (`UNLICENSED`), so dependencies only need permissive terms
# that allow private use and redistribution of a built binary. No copyleft: GPL, AGPL, LGPL, SSPL.
version = 2
confidence-threshold = 0.9
# Allowances for licences no current dependency uses are deliberate (the toolbox will grow); do not warn.
unused-allowed-license = "allow"

allow = [
    "MIT",
    # MIT No Attribution: borrow-or-share, via jsonschema, which the Hotline uses to check requests (#10).
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # egui's bundled default fonts (epaint_default_fonts, in Board's window): both licences allow
    # redistributing the fonts inside a built binary.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# One crate may carry a weak-copyleft licence, named here so nothing else can. MPL-2.0 is file-level: it
# binds only changes to option-ext's own files, and it ships unmodified. It comes in through dirs-sys under
# hf-hub under fastembed (news-taster feature `embed`).
# CDLA-Permissive-2.0 (permissive, allows redistribution) covers the Mozilla CA root list as data in
# webpki-roots and webpki-root-certs, via ureq under hf-hub under fastembed (same feature); no other crate.
exceptions = [
    { allow = ["MPL-2.0"], crate = "option-ext" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[licenses.private]
# Our own crates are `publish = false` with `license = "UNLICENSED"`, which is not an SPDX expression.
ignore = true

[bans]
# Duplicate major versions slow builds and grow the binary; warn so they are visible, not blocking.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # path dependencies between our own crates carry no version
highlight = "all"
deny = []

[sources]
# crates.io only: no git dependencies, no alternative registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
