# Nose scorer config v1 (Bureau Design §4.2–§4.3, ADR 0012). Every score row records `version`, so a
# change of weights is a new file and a new version (calibration, #19, proposes them), never an edit to v1.

version = "v1"

# S = 100 · Q · (wI·I + wM·M + wF·F + wD·D + wN·N + wG·G); the weights sum to 1.
[weights]
I = 0.30
M = 0.20
F = 0.15
D = 0.15
N = 0.10
G = 0.10

# Freshness F = 2^(−age_h / h), h by page type (hours).
[half_life_hours]
news = 12
macro = 24
policy = 24
earnings = 48
science = 72
report = 96
