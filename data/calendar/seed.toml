# Hand-checked decision dates for central banks whose calendars are not machine-readable (Bureau Design §3.3).
# Every entry names the page it was read from and the day a person checked it; Diary refuses an entry without them.
# Fed dates come from the FOMC page itself (parsed live), not from this file. Not yet seeded: ECB (the calendar page
# loads its dates by script), Bank of Canada, RBA, BoJ and RBI: add them here once checked against the bank's own page.

