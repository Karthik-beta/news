# Central banks: the Stringers emit ("cb", <key>) identifiers (cli/crates/news-connectors/src/centralbank.rs),
# so Roster needs these entities before the first statement arrives. Hand-written; loaded with
# news_roster::store::apply.

[[entity]]
kind = "central_bank"
name = "Federal Reserve"
region = "us"
prominence = 1
ids = [{ scheme = "cb", value = "fed" }]
aliases = ["The Fed", "Fed", "Federal Reserve System", "Federal Reserve Board", "Federal Open Market Committee", "FOMC"]

