# Prominence seed lists (Bureau §3.5, §4.2): 1 flagship, 2 major, 3 other (the default). Entities are
# named by identifier; an identifier not yet in Roster is skipped, so the list can run before or
# after the SEC and Wikidata seeds. Loaded with news_roster::store::apply_prominence.
# CIKs are as the SEC lists them; a person should confirm them once against company_tickers.

# ---- countries (ISO 3166-1 alpha-2): the G7 and the next largest economies ------------------------
