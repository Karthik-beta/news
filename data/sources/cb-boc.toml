# Contacts row for Bank of Canada press releases (Bureau Design §3.1). Loaded by `news sources sync`; the Contacts lint checks it in CI.
source_id = "cb-boc"
name = "Bank of Canada press releases"
publisher = "Bank of Canada"
connector = "cb-boc"
base_url = "https://www.bankofcanada.ca/"
source_tier = 1
licence = "custom"
attribution = "Source: Bank of Canada."
redistribution = true
image_policy = "none"
rate_per_sec = 0.2
documented_rate_per_sec = 1
documented_limit = "No published request limit (unverified: 18 Nov 2026); polite pacing"
max_concurrency = 1
robots_respect = true
requires_contact_email = false
regions = ["ca"]
categories = ["economy","monetary-policy"]
calendar_kind = "html"
enabled = true
notes = "Statement Stringer: feed discovery, page fetch, event key policy:<bank>:<date>. Licence: Bank of Canada Terms of use, https://www.bankofcanada.ca/terms/ (read 28 Nov 2026), section 1: the Bank permits you to freely use, copy, distribute and transmit its website content, provided you (1.1) attribute the Bank of Canada as the source and indicate changes, (1.2) take care that reproduced content is accurate and (1.3) tell buyers of any paid product that the content is free on the Bank's website. Section 2 excludes bank note images, the logo and wordmark, and third-party content, so image_policy stays none. Statements may be quoted and republished with the attribution. Meeting dates: Diary (FOMC page parse and the yearly seed file)."
