# gitleaks configuration (gitleaks-action reads it from the repository root). The default rules apply in full;
# the allowlist below covers one known false positive and nothing else.
# The action pins gitleaks 8.24, which reads the single [allowlist] table (the [[allowlists]] array came later).
title = "news"

[extend]
useDefault = true

# Chart JSON downloads in the fixture bundles: a column's `key` is a series reference (`sr_` + base-36 id), which
# generic-api-key reads as a key. Only that exact line shape. Unanchored: in a git scan the line carries the diff's "+".
[allowlist]
description = "Series-reference column keys in fixture chart JSON"
regexTarget = "line"
regexes = ['''"key": "sr_[a-z0-9]+"''']
